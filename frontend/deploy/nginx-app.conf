# Inclus dans le bloc server de l'image UBI nginx (écoute 8080).
root /opt/app-root/src;
index index.html;

# En-têtes de sécurité : aucun add_header dans les blocs location, sinon nginx ne les hérite plus.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Back-end relayé sur la même origine : pas de CORS, jetons jamais exposés à un tiers.
location /api/ {
  proxy_pass http://backend:3000/;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  client_max_body_size 5m;
}

location = /config.json {
  expires -1;
  try_files /config.json =404;
}

location /assets/ {
  expires 1y;
  try_files $uri =404;
}

# Application monopage : toute autre adresse sert index.html.
location / {
  expires epoch;
  try_files $uri /index.html;
}
